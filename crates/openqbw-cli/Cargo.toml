[package]
name = "openqbw-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords = ["quickbooks", "qbw", "cli", "accounting"]
categories = ["command-line-utilities"]
description = "Command-line exporter for QuickBooks .qbw files."

[[bin]]
name = "openqbw"
path = "src/main.rs"

[features]
# Controlled fixture/oracle tooling is deliberately opt-in.  The production
# CLI has no SDK-oracle, QBXML, or synthetic-fixture command surface.
research-tools = []

[dependencies]
openqbw = { workspace = true }
opensqlany = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
rusqlite = { workspace = true }

[lints]
workspace = true
